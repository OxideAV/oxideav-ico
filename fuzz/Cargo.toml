[package]
name = "oxideav-ico-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# ICO is a container wrapping BMP or PNG sub-images. There is no
# standard system library to cross-decode against (libgdiplus etc.
# aren't worth pulling in), so this crate ships two complementary
# self-checking fuzz targets instead of differential ones:
#
# * `ico_self_roundtrip` — RGBA → codec encode → codec decode → RGBA
#   pixel-equality. Catches encoder bugs that emit corrupt sub-images
#   and decoder bugs that mis-parse legitimate output.
# * `ico_raw_parser` — arbitrary bytes → standalone `read_ico_raw`
#   container parser, then writer round-trip on accepted inputs. Catches
#   panics / overflows / OOB in the directory walker, the RIFF/ACON
#   detection, the payload-overlap detector, and the planes / bit_count
#   validators.
# * `ani_raw_parser` — arbitrary bytes → standalone `read_ani_raw`
#   RIFF/ACON parser, every playback accessor (playback_steps /
#   total_jiffies / step_at_jiffy / step_at_second / raw_bmp_descriptor),
#   then a `write_ani_raw` value-stability round-trip on accepted inputs.
#   Catches panics / overflows / OOB in the RIFF chunk walker, the anih
#   header validator, the seq / rate array parsers, the frame extractor,
#   and the timeline resolution arithmetic.

[dependencies]
libfuzzer-sys = "0.4"
oxideav-core = "0.1"

[dependencies.oxideav-ico]
path = ".."

[lib]
name = "oxideav_ico_fuzz"
path = "src/lib.rs"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "ico_self_roundtrip"
path = "fuzz_targets/ico_self_roundtrip.rs"
test = false
doc = false

# Standalone container-parser harness. Drives `read_ico_raw` /
# `write_ico_raw` on arbitrary fuzz bytes — covers the directory
# walker, RIFF/ACON detection, payload-overlap detector, planes /
# bit_count validators, offset overflow guards, and round-trips parser
# output through the writer. Independent from `ico_self_roundtrip`
# (which fuzzes the codec / PNG / BMP-DIB encode + decode pair).
[[bin]]
name = "ico_raw_parser"
path = "fuzz_targets/ico_raw_parser.rs"
test = false
doc = false

# Standalone ANI (RIFF/ACON animated-cursor) parser harness. Drives
# `read_ani_raw` + every playback accessor on arbitrary fuzz bytes, then
# round-trips accepted values through `write_ani_raw`. Covers the RIFF
# chunk walker, the anih validator, the seq / rate parsers, the frame
# extractor, and the timeline arithmetic. Independent from the two ICO
# targets (ANI is a different container `read_ico_raw` refuses).
[[bin]]
name = "ani_raw_parser"
path = "fuzz_targets/ani_raw_parser.rs"
test = false
doc = false
