name: CI

# Two CI paths:
#
# * `ci` (default-features) — uses the OxideAV org-level reusable workflow,
#   which exercises the registry-integrated path (oxideav-core dep +
#   Decoder/Encoder trait impls + oxideav-bmp/oxideav-png sub-image
#   decoders).
# * `ci-standalone` (no-default-features) — inline job that builds,
#   tests and clippy-checks the crate with `--no-default-features`,
#   exercising the `oxideav-core`-free standalone layer (the whole
#   image-crate contract: `probe` / `info` / `decode*` / `encode*`, plus
#   `read_ico_raw` / `write_ico_raw` / the ANI model). Catches
#   regressions where the standalone path accidentally regrows an
#   oxideav-core import.
#
# Both paths resolve `oxideav-bmp` / `oxideav-png` from crates.io (the
# newest 0.1.x / 0.2.x — the crate needs their image-crate-contract
# surface, first published as bmp 0.1.7 / png 0.1.11).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  ci-standalone:
    name: Build & test (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: standalone

      - name: Build (no-default-features)
        run: cargo build --no-default-features --verbose

      - name: Test (no-default-features)
        run: cargo test --no-default-features --verbose

      - name: Clippy (no-default-features)
        run: cargo clippy --no-default-features --all-targets --no-deps -- -D warnings
